<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plano de placas para pared</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main>
<h1>Plano de placas para la pared</h1>
<p class="sub">Elegí desde dónde empezar a colocar y mirá el plano con los cortes.</p>

<div class="grid">
<fieldset><legend>Pared (en metros)</legend>
<div class="row">
<label>Ancho (m)<input id="pw" type="number" min="0" step="0.01" value="3.5"></label>
<label>Alto (m)<input id="ph" type="number" min="0" step="0.01" value="2.5"></label>
</div></fieldset>

<fieldset><legend>Placa (en centímetros)</legend>
<div class="row">
<label>Ancho (cm)<input id="tw" type="number" min="0" step="any" value="60"></label>
<label>Alto (cm)<input id="th" type="number" min="0" step="any" value="60"></label>
</div></fieldset>

<fieldset><legend>Colocación</legend>
<div class="row">
<label>Disposición
<select id="mode"><option value="stag">Intercalada (cada fila corrida media placa)</option><option value="grid">Alineada (juntas a plomo)</option></select></label>
<label>Junta (mm)<input id="jt" type="number" min="0" step="any" value="2"></label>
</div>
<div class="row">
<label>Empezar a lo ancho
<select id="sx"><option value="center">Centrado</option><option value="left">Desde la izquierda</option><option value="right">Desde la derecha</option></select></label>
<label>Empezar a lo alto
<select id="sy"><option value="center">Centrado</option><option value="bottom">Desde abajo</option><option value="top">Desde arriba</option></select></label>
</div></fieldset>

<fieldset><legend>Compra</legend>
<div class="row">
<label>Margen extra por roturas (%)<input id="wa" type="number" min="0" step="any" value="5"></label>
<label>Corte mínimo deseado (cm)<input id="mc" type="number" min="0" step="any" value="15"></label>
</div></fieldset>
</div>

<section class="res" id="res" aria-live="polite"></section>
<section class="draw"><div id="svg"></div>
<div class="leg"><span><i style="background:var(--tile)"></i>Placa entera</span><span><i style="background:var(--cut)"></i>Placa cortada (medida del trozo que queda en la pared, en cm)</span></div></section>
</main>

<script src="script.js"></script>
</body>
</html>
